aid: graphitehealth
name: Graphite Health
description: >-
  Graphite Health is a member-led, non-profit 501(c)(4) health-data infrastructure
  company founded by Intermountain Health, Presbyterian Healthcare Services and SSM
  Health, later joined by Kaiser Permanente and Emory Healthcare. It operates a platform
  that ingests, standardizes and integrates clinical data across member health systems —
  a connector library for clinical and external systems, a single interoperable data
  model, managed container runtimes, developer APIs and a data sandbox — and governs the
  S2 standard, an information standard encoding the operational semantics of health data
  whose adoption is funded by Gates Ventures. On top of the platform it runs an
  application marketplace whose apps must be certified under Graphite's Digital
  Hippocratic Oath. As of this profiling pass Graphite publishes no public developer
  documentation and no machine-readable contract; its FHIR, platform-core and identity
  hosts exist in DNS but refuse connections from the public internet.
