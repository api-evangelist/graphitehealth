x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    Graphite Health markets developer APIs, an SDK and a data sandbox on /platform and
    /marketplace, but /developers is a 308 redirect to that marketing page whose only
    call to action is a contact form — and the three API-shaped hosts that do exist in
    DNS (fhir.graphitehealth.io, labs-core.graphitehealth.io, id.graphitehealth.io) all
    refuse TCP 443 from the public internet, so the platform is reachable only from
    inside member health-system networks.
